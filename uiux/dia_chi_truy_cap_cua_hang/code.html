<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1c43a6",
                        "background-light": "#f6f6f8",
                        "background-dark": "#121620",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display">
<div class="layout-container flex h-full grow flex-col">
<header class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-6 py-3 lg:px-10">
<div class="flex items-center gap-2 text-primary">
<div class="size-8 bg-primary rounded-lg flex items-center justify-center text-white">
<span class="material-symbols-outlined">cloud_done</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-xl font-bold leading-tight tracking-tight">CloudPOS</h2>
</div>
<button class="flex items-center justify-center rounded-lg h-10 w-10 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200 transition-colors">
<span class="material-symbols-outlined">help</span>
</button>
</header>
<main class="flex-1 flex items-center justify-center p-4 lg:p-8">
<div class="w-full max-w-[480px] flex flex-col gap-6">
<div class="bg-white dark:bg-slate-900 rounded-xl shadow-xl overflow-hidden border border-slate-200 dark:border-slate-800">
<div class="relative h-48 bg-primary/10 overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-primary/20 to-transparent"></div>
<div class="absolute inset-0 flex items-center justify-center">
<span class="material-symbols-outlined text-primary/40 text-7xl">storefront</span>
</div>
<div class="absolute inset-0 bg-cover bg-center opacity-30" data-alt="Modern retail store interior abstract illustration" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuASdIZLY1Qx90CxvOvmrgtB-TtxkEAPgKn2cpAplTstthaUOY0GN3Uy0mdiaYBQ0pZ1SNlusKWUtHM0HJiqW-qg7r-ZZCCKW-akZLMusNmkc1y9XSNGh0kUtHQJzVPrzDA5Wga5Bn6jIe3_B9ZUh5k91zUTy5HdVHQIxbaveTLwPqNL-zoNe8bYf_CZHhcfy5YeMTnOaq5SIa_wrS4HeXgInLkMYGu2reDkRCWeKsRaGt3kH0xx04DHMldIL4tl30Je-QwtyaLyLqs')"></div>
</div>
<div class="p-8 flex flex-col gap-6">
<div class="flex flex-col gap-2">
<h1 class="text-slate-900 dark:text-slate-100 text-2xl font-bold tracking-tight">Địa chỉ truy cập cửa hàng</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm leading-relaxed">Nhập địa chỉ cửa hàng của bạn để bắt đầu quản lý kinh doanh ngay hôm nay.</p>
</div>
<div class="flex flex-col gap-4">
<label class="flex flex-col gap-2">
<span class="text-slate-700 dark:text-slate-300 text-sm font-semibold">Mã cửa hàng (slug)</span>
<div class="flex items-stretch group">
<div class="relative flex-1">
<input class="form-input flex w-full rounded-l-lg border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary h-14 pl-4 pr-2 text-base font-normal placeholder:text-slate-400" placeholder="ví dụ: my-shop" type="text"/>
</div>
<div class="flex items-center px-4 bg-slate-50 dark:bg-slate-800 border-y border-r border-slate-300 dark:border-slate-700 rounded-r-lg text-slate-500 dark:text-slate-400 font-medium">
                                        .cloudpos.vn
                                    </div>
</div>
</label>
<button class="w-full h-14 bg-primary hover:bg-primary/90 text-white rounded-lg font-bold text-base transition-all shadow-md flex items-center justify-center gap-2 group">
                                Tiếp tục
                                <span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</div>
</div>
<div class="flex flex-col gap-4 text-center">
<p class="text-slate-500 dark:text-slate-400 text-sm">
                        Bạn gặp khó khăn khi đăng nhập? 
                        <a class="text-primary font-semibold hover:underline decoration-2 underline-offset-4 ml-1" href="#">Liên hệ hỗ trợ</a>
</p>
<div class="flex items-center justify-center gap-4 text-slate-400 dark:text-slate-600">
<span class="text-xs">© 2024 CloudPOS System</span>
<span class="w-1 h-1 bg-slate-300 rounded-full"></span>
<span class="text-xs">Tiếng Việt</span>
</div>
</div>
</div>
</main>
</div>
</body></html>
